<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Control de Usina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Control de Usina</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: planilla centrada como el formulario en papel para operadores; panel ancho con pestañas para A y B. Marca SPSE: azul institucional */
:root{
  --bg:#e7ebf1; --sheet:#fbfcfd; --ink:#15202d; --muted:#596678; --line:#c5cdd8; --rule:#22314a;
  --brand:#1e3a66; --brand-ink:#ffffff; --brand-soft:#dfe7f3; --accent:#1e4f8c; --accent-ink:#ffffff;
  --danger:#b3261e; --danger-ink:#ffffff; --danger-bg:#fbe4e2;
  --ok:#1b6e3a; --ok-bg:#dff1e5; --warn:#8a5300; --warn-bg:#fdf0d5; --info:#1e4f8c; --info-bg:#e1ebf7;
  --field:#f1f4f8; --pad-bg:#ffffff; --pad-ink:#101820; --shadow:0 1px 2px rgba(20,30,50,.08),0 6px 20px rgba(20,30,50,.07);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --sheet:#161f2b; --ink:#e2e8f0; --muted:#97a3b3; --line:#2e3a4a; --rule:#9fb0c6;
  --brand:#1e3a66; --brand-ink:#ffffff; --brand-soft:#1a2b45; --accent:#7fa8e0; --accent-ink:#0b1626;
  --danger:#ff7b72; --danger-ink:#2a0b09; --danger-bg:#3d1b1a;
  --ok:#7fd49b; --ok-bg:#163223; --warn:#f2bf5e; --warn-bg:#3a2c10; --info:#8fb5ea; --info-bg:#172a44;
  --field:#101822; --pad-bg:#ffffff; --pad-ink:#101820; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c; --sheet:#161f2b; --ink:#e2e8f0; --muted:#97a3b3; --line:#2e3a4a; --rule:#9fb0c6;
  --brand:#1e3a66; --brand-ink:#ffffff; --brand-soft:#1a2b45; --accent:#7fa8e0; --accent-ink:#0b1626;
  --danger:#ff7b72; --danger-ink:#2a0b09; --danger-bg:#3d1b1a;
  --ok:#7fd49b; --ok-bg:#163223; --warn:#f2bf5e; --warn-bg:#3a2c10; --info:#8fb5ea; --info-bg:#172a44;
  --field:#101822; --pad-bg:#ffffff; --pad-ink:#101820; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);margin:0}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0}
.wrap.wide{max-width:1180px}
#app{min-height:100%;display:flex;flex-direction:column}

/* Barra superior */
.topbar{background:var(--brand);color:var(--brand-ink)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:30px;width:auto;border-radius:4px;display:block}
.brand b{font:700 1.2rem/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.brand small{display:block;font:500 .74rem/1.3 var(--f-body);opacity:.85}
.tb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-size:.8rem;text-align:right;line-height:1.25}
.who b{display:block;font-size:.88rem}
.topbar .ghost{color:var(--brand-ink);border-color:rgba(255,255,255,.4)}
.pill{font-size:.76rem;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--brand-ink);white-space:nowrap}
.pill.ok{background:#2e7d4f}.pill.warn{background:#9a6a12}.pill.err{background:#a3352d}

.tabsbar{background:var(--sheet);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabsbar .wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-block:6px}
.navtab{border:0;background:transparent;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted);position:relative}
.navtab[aria-current="page"]{background:var(--brand-soft);color:var(--ink)}
.navtab .badge{position:absolute;top:2px;right:2px;background:var(--danger);color:var(--danger-ink);border-radius:999px;font-size:.66rem;padding:0 5px;line-height:1.4}
.distsel{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.distsel select{width:auto;padding:6px 8px}

.banner{border:1px solid var(--line);background:var(--brand-soft);padding:10px 12px;border-radius:6px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-block:12px}
.banner.hist{background:var(--info-bg);color:var(--info);border-color:transparent}
.banner.edit{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600}

/* Ingreso */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.login-panel{background:var(--brand);color:var(--brand-ink);border:4px double #c9d6ea;padding:22px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:var(--shadow)}
.login-panel img{width:100%;max-width:330px;height:auto;display:block}
.login-panel input,.login-panel input[type=password],.login-panel input:not([type]){background:#fff!important;color:#111!important;-webkit-text-fill-color:#111;caret-color:#111;border:0;border-radius:2px;text-align:center;font-size:1.15rem;padding:12px;color-scheme:light}
.login-panel input::placeholder{color:#8a94a3;-webkit-text-fill-color:#8a94a3;opacity:1}
.login-panel input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #fff inset;-webkit-text-fill-color:#111}
.pwbox{position:relative;width:100%}
.pwbox input[type=password]{color:transparent!important;-webkit-text-fill-color:transparent;caret-color:transparent;letter-spacing:0}
.pwbox input:-webkit-autofill{-webkit-text-fill-color:transparent}
.pwmask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#111;font:700 1.35rem/1 ui-monospace,Consolas,monospace;letter-spacing:.18em;overflow:hidden;white-space:nowrap}
.pwmask.on::after{content:"";display:inline-block;width:2px;height:1.2em;background:#111;margin-left:2px;animation:pwblink 1s steps(1) infinite}
@keyframes pwblink{50%{opacity:0}}
.login-panel label{font:700 1.4rem var(--f-display);letter-spacing:.04em;text-align:center;display:block}
.login-panel label small{display:block;font:400 .95rem var(--f-body);letter-spacing:0;opacity:.9}
.login-panel .lf{width:100%;display:flex;flex-direction:column;gap:6px}
.login-msg{min-height:1.3em;font-size:.9rem;color:#ffd7d3;text-align:center}
.login-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.demo-note{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:.84rem}

/* Planilla */
.sheet{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.frame{background:var(--sheet);border:4px double var(--rule);padding:16px;box-shadow:var(--shadow)}
.frame-in{display:flex;flex-direction:column;gap:16px}
.head{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px}
.fecha{font:600 1.05rem var(--f-display);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.distrito{font-size:.95rem;text-align:right}
.distrito u,.distrito b{font-weight:600}
.turno{grid-column:1/-1;text-align:center;font:700 clamp(1.6rem,6vw,2.1rem)/1.1 var(--f-display);margin:6px 0 0;letter-spacing:.02em;text-wrap:balance}
.turno u{text-underline-offset:4px;text-decoration-thickness:2px}
.hoja-tag{grid-column:1/-1;text-align:center;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;border:1px dashed var(--rule);padding:10px 12px}
.kv .lbl{font:700 .95rem var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.kv .val{font:600 1.25rem var(--f-body);font-variant-numeric:tabular-nums;text-align:right;font-style:italic}
.unit{font-size:.8rem;color:var(--muted);font-style:italic}
.kv.solid{border-style:solid;border-width:2px}
.kv.neg .val{color:var(--danger)}
.sec{font:700 1.05rem var(--f-display);letter-spacing:.03em;display:block;margin-bottom:6px}
.sec small{font:500 .8rem var(--f-body);color:var(--muted);letter-spacing:0;margin-left:4px}
textarea,input[type=text],input[type=time],input[type=date],input[type=month],input[type=password],input[type=number],input:not([type]),select{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:9px 10px;outline:none}
textarea.lined{resize:vertical;background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);line-height:32px;padding-top:0}
textarea{resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.trucks{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:minmax(84px,.8fr) minmax(0,1.5fr) minmax(0,1.2fr) 40px;gap:6px;align-items:center}
.trow input{font-style:italic;font-weight:600}
.tflags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.tflags:empty{display:none}
.round{background:var(--danger)!important;color:var(--danger-ink)!important;border-color:var(--danger)!important}
.bad{border-color:var(--danger)!important;box-shadow:inset 0 0 0 1px var(--danger)}
.chip{display:inline-block;font:600 .72rem var(--f-body);padding:2px 8px;border-radius:999px;background:var(--field);color:var(--muted);border:1px solid var(--line);letter-spacing:.01em}
.chip.r{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.chip.g{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.y{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.b{background:var(--info-bg);color:var(--info);border-color:transparent}
.empty{margin:0;color:var(--muted);font-size:.9rem;font-style:italic}
.x{width:40px;height:40px;border:1px solid var(--line);background:transparent;border-radius:4px;cursor:pointer;font-size:1.2rem;line-height:1;color:var(--muted)}
.x.arm{background:var(--danger);color:var(--danger-ink);border-color:var(--danger);font-size:.68rem;font-weight:700}
.add{align-self:flex-start;margin-top:8px;border:1px dashed var(--accent);color:var(--accent);background:transparent;padding:8px 12px;border-radius:4px;cursor:pointer;font-weight:600}
.tanks{display:flex;flex-direction:column;border:2px solid var(--rule)}
.tank{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,40%);align-items:center;border-bottom:1px solid var(--rule);position:relative}
.tank:last-child{border-bottom:0}
.tank label{padding:8px 10px;font-weight:600;font-size:.92rem;border-right:1px solid var(--rule)}
.tank label small{color:var(--muted);font-weight:500}
.tank.serv label{box-shadow:inset 4px 0 0 var(--accent)}
.tank-in{display:flex;align-items:center;gap:6px;padding:4px 8px}
.tank-in input{border:0;background:transparent;padding:6px 4px;font-size:1.05rem}
.gauge{position:absolute;left:0;bottom:0;height:3px;width:100%;pointer-events:none}
.gauge i{display:block;height:100%;width:0;background:var(--accent);opacity:.5;transition:width .25s}
.gauge i.over{background:var(--danger);opacity:1}
.src{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;margin-left:2px;vertical-align:1px;white-space:nowrap}
.src.t{background:var(--info-bg);color:var(--info)}
.src.r{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.grupos{display:flex;flex-wrap:wrap;gap:8px}
.gchip{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:8px 10px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:96px}
.gchip small{font-weight:500;color:var(--muted);font-size:.72rem}
.gchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gchip[aria-pressed="true"] small{color:inherit;opacity:.85}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.anom{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.anom.on{border-color:var(--danger);background:var(--danger-bg)}
.check{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.92rem}
.check input{width:18px;height:18px}
.h2truck{border-top:2px dotted var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.h2truck h2{margin:0;font:700 1.15rem var(--f-display);letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-style:italic}
.h2grid{display:grid;grid-template-columns:minmax(120px,40%) minmax(0,1fr);gap:6px 10px;align-items:center}
.h2grid label,.h2grid .l{font-weight:700;font-size:.95rem}
.h2grid output{font-weight:600;font-variant-numeric:tabular-nums;padding:8px 10px;border:1px dashed var(--line);border-radius:4px}
.cist{display:flex;flex-direction:column;gap:6px}
.comp{display:grid;grid-template-columns:minmax(86px,auto) minmax(90px,1fr) auto minmax(130px,1fr);gap:4px 10px;align-items:center;padding:4px 6px;border-radius:4px;border-left:4px solid var(--line)}
.comp select{grid-column:4}.comp select+select{grid-column:2 / span 3}
.comp.e-d{border-left-color:var(--ok)}.comp.e-v{border-left-color:var(--line);background:var(--field)}.comp.e-o{border-left-color:var(--info);background:var(--info-bg)}
.comp input:disabled{opacity:.55}
@media (max-width:520px){.comp{grid-template-columns:auto 1fr auto}.comp select{grid-column:1 / -1}}
.cist label{font-weight:700;font-size:.95rem}
.corr{align-self:flex-end;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:9px 14px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.corr.need{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.foto-box{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;border:1px dashed var(--line);border-radius:6px;padding:8px}
.foto-thumb{width:96px;height:72px;border-radius:4px;background:var(--field);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:.8rem;text-align:center}
.foto-thumb img{width:100%;height:100%;object-fit:cover}
.foto-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.foto-txt>.chip{align-self:flex-start}
.foto-btns{display:flex;gap:6px;flex-wrap:wrap}
.firma{background:var(--sheet);border:1px dashed var(--rule);padding:14px;display:flex;flex-direction:column;gap:10px}
.opinfo{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.92rem}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.pad{display:block;width:100%;height:130px;background:var(--pad-bg);border:1px solid var(--line);border-radius:4px;touch-action:none;cursor:crosshair}
.pad-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.firma-cap{text-align:center;font-weight:700;text-decoration:underline;font-size:.95rem}
.firma-img{max-width:100%;height:100px;object-fit:contain;background:var(--pad-bg);border:1px solid var(--line);border-radius:4px;display:block}

.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.brand{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.goto{background:var(--danger);color:var(--danger-ink);border-color:var(--danger)}
.btn[aria-disabled="true"]{opacity:.5}
.btn.small,.ghost.small{padding:6px 10px;font-size:.85rem}
.ghost{border:1px solid var(--line);background:transparent;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.actionbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:auto}
.actionbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status{font-size:.85rem;color:var(--muted);flex:1 1 200px;min-width:0}
.status b{color:var(--ink)}
.actions{display:flex;gap:8px;margin-left:auto}

/* Panel */
.panel{padding-block:16px;display:flex;flex-direction:column;gap:14px}
.ptitle{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.ptitle h1{margin:0;font:700 1.6rem/1.1 var(--f-display);letter-spacing:.02em}
.ptitle p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:14px}
.row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.toolbar .field{min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctl-sum{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.9rem;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{font:700 .74rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--field)}
td.n{text-align:right}
td.cbad{background:var(--danger-bg);color:var(--danger);font-weight:700}
tr.row-bad td:first-child{box-shadow:inset 4px 0 0 var(--danger)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--field)}
td.wrap{white-space:normal;min-width:220px}
td.wrap .chip{margin:1px 0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:8px 14px}
/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.day{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:6px;min-height:74px;display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left}
.day:hover{border-color:var(--accent)}
.day.out{visibility:hidden}
.day .dn{font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.day .dn .inf{font-size:.66rem;background:var(--info-bg);color:var(--info);border-radius:999px;padding:0 6px}
.tq{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.tq i{height:14px;border-radius:3px;background:var(--field);border:1px solid var(--line)}
.tq i.ok{background:var(--ok);border-color:var(--ok);opacity:.75}
.tq i.y{background:var(--warn);border-color:var(--warn);opacity:.8}
.tq i.r{background:var(--danger);border-color:var(--danger)}
.tq i.open{background:transparent;border-style:dashed;border-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font:700 1.35rem var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
/* Detalle */
.dl{display:grid;grid-template-columns:minmax(130px,34%) minmax(0,1fr);gap:4px 12px;font-size:.92rem}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0}
.block{display:flex;flex-direction:column;gap:8px}
.block h4{margin:0;font:700 1rem var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.firmas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fslot{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.fslot .cap{font-size:.8rem;text-align:center;border-top:1px solid var(--rule);padding-top:4px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,16,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:20}
.modal-card{background:var(--sheet);border:4px double var(--rule);width:100%;max-width:980px;padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-card.narrow{max-width:560px}
.modal-card h3{margin:0;font:700 1.35rem var(--f-display);letter-spacing:.03em}
.modal-card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.summary{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}
.summary b{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:6px;font-size:.9rem;max-width:calc(100% - 32px);z-index:30;box-shadow:var(--shadow)}
.fl{margin-top:4px;font-size:.82rem}
.fl a{color:var(--accent);font-weight:600}
@media (max-width:520px){
  .frame{padding:12px}
  .trow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px}
  .trow [id^=tl]{grid-column:1/3}
  .trow .x{grid-column:3;grid-row:2}
  .grid2{grid-template-columns:1fr}
  .tank{grid-template-columns:minmax(0,1fr) minmax(110px,44%)}
  .day{min-height:58px;padding:4px}
  .tq i{height:10px}
  .who{display:none}
  .distsel{margin-left:0;width:100%}
}
@media print{
  .topbar,.tabsbar,.actionbar,.toast,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .modal{position:static;background:none;padding:0;display:block}
  .modal-card{border:0;max-width:none;padding:0}
  #app.printing>*:not(.modal){display:none}
}
@media print{
  #app.printing-main .topbar,#app.printing-main .tabsbar,#app.printing-main .ptitle,#app.printing-main .stats,#app.printing-main>.wrap,#app.printing-main .panel>.hint{display:none!important}
  #app.printing-acta .topbar,#app.printing-acta .tabsbar,#app.printing-acta .ptitle,#app.printing-acta .cf-res,#app.printing-acta>.wrap{display:none!important}
  #app.printing-acta .grid2{display:block}#app.printing-acta .grid2>.card:not(#cfActa){display:none!important}
  table.pl{font-size:8pt}table.pl th,table.pl td{padding:2px 3px}
  .firmas-print{display:flex!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v5: planilla, control físico, histórico */
.planilla .pl-head{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;margin-bottom:10px}
.planilla .pl-head b:first-child{font:700 1.15rem var(--f-display);letter-spacing:.03em}
table.pl th{white-space:normal;min-width:64px;font-size:.78rem;vertical-align:bottom}
table.pl td{font-variant-numeric:tabular-nums;white-space:nowrap}
table.pl tfoot td{border-top:2px solid var(--rule);background:var(--brand-soft)}
.firmas-print{display:none;justify-content:space-around;margin-top:48px}.firmas-print span{border-top:1px solid #000;padding-top:4px;min-width:220px;text-align:center}
.cf-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.cf-res>div{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.cf-res span{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.cf-res b{font:700 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
.cf-res small{color:var(--muted);font-size:.8rem}
.cf-res.falt .big{background:var(--danger-bg);border-color:var(--danger)}.cf-res.falt .big b,.cf-res.falt .big span{color:var(--danger)}
.cf-res.sob .big{background:var(--ok-bg);border-color:var(--ok)}.cf-res.sob .big b,.cf-res.sob .big span{color:var(--ok)}
.acta-txt{line-height:1.6}
.firmas-cf{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.pad.small{height:100px}.sigline{height:60px;border-bottom:1px solid var(--rule)}
.progress{height:10px;border-radius:5px;background:var(--field);border:1px solid var(--line);overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.hcam{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;background:var(--sheet)}
.hcomps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px;margin-top:8px}
.hcomp{display:grid;grid-template-columns:28px 1fr auto;gap:4px;align-items:center}.hcomp span{font-weight:700}.hcomp select+select{grid-column:2 / -1}
.htanks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
tr.robot td{background:var(--info-bg)}
</style>

<script>
(function(){
'use strict';
/* =====================================================================
   CONTROL DE USINA — SPSE  · v5
   Núcleo: datos, almacenamiento, usuarios, sesiones, cálculo de turnos
   ===================================================================== */
var DATA=JSON.parse(document.getElementById('cfgdata').textContent);
var LOGO=DATA.logo||{};
var TURNOS=['00:00 a 06:00','06:00 a 12:00','12:00 a 18:00','18:00 a 00:00'];
var NCAM=7;
var TIPOS_INF=['Accidente','Falla de grupo generador','Falla de equipo o instalación','Camión: descarga parcial o rechazo','Redeclaración de camión','Corrección de datos de un turno','Faltante o pérdida de combustible','Otro'];
var DEF_CFG={syncUrl:'',syncKey:'',tolL:300,tolP:2,fotoRemito:true,fotoCaud:false,minAntes:15,horasTarde:2,distOv:{},devDist:'',bases:{}};
var DIAS_LOCAL=120;
var ROBOT={legajo:'0000',nombre:'Robot-Histórico',iniciales:'rh',cat:'D-1',dist:[],activo:true,robot:true};
var EST_CAM={d:'Descargada',v:'Vino vacía',o:'Derivada a otro distrito'};

/* ---------- almacenamiento ---------- */
var mem={};
function sget(k,d){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v);}catch(e){}return Object.prototype.hasOwnProperty.call(mem,k)?JSON.parse(JSON.stringify(mem[k])):d;}
function sset(k,v){mem[k]=JSON.parse(JSON.stringify(v));try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function sdel(k){delete mem[k];try{localStorage.removeItem(k);}catch(e){}}
var cfg=Object.assign({},DEF_CFG,sget('cpt.cfg',{}));
function saveCfg(){sset('cpt.cfg',cfg);}
var deviceId=sget('cpt.device',null);if(!deviceId){deviceId='DISP-'+Math.random().toString(36).slice(2,8).toUpperCase();sset('cpt.device',deviceId);}

/* ---------- fotos (IndexedDB) ---------- */
var fotoMem={},dbP=null;
function db(){if(dbP)return dbP;dbP=new Promise(function(res){try{var rq=indexedDB.open('cpt-fotos',1);rq.onupgradeneeded=function(){rq.result.createObjectStore('f');};rq.onsuccess=function(){res(rq.result);};rq.onerror=function(){res(null);};}catch(e){res(null);}});return dbP;}
function idb(mode,fn){return db().then(function(d){if(!d)return null;return new Promise(function(res){try{var tx=d.transaction('f',mode),st=tx.objectStore('f'),rq=fn(st);tx.oncomplete=function(){res(rq&&rq.result);};tx.onerror=function(){res(null);};}catch(e){res(null);}});});}
function fotoPut(id,data){fotoMem[id]=data;return idb('readwrite',function(st){return st.put(data,id);});}
function fotoGet(id){if(fotoMem[id])return Promise.resolve(fotoMem[id]);return idb('readonly',function(st){return st.get(id);}).then(function(v){if(v)fotoMem[id]=v;return v||null;});}
function fotoDel(id){delete fotoMem[id];return idb('readwrite',function(st){return st.delete(id);});}
function achicar(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){var M=1280,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,M/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.62));};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('imagen ilegible'));};im.src=u;});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});}catch(e){}

/* ---------- utilidades ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function r2(n){return Math.round(n*100)/100;}
function parseAR(s){if(s==null)return null;s=String(s).trim().replace(/\s/g,'');if(!s)return null;if(s.indexOf(',')>=0){s=s.replace(/\./g,'').replace(',','.');}else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'');}var n=Number(s);return isFinite(n)?r2(n):null;}
var nf0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:2}),nf2=new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
function fmt(v,two){if(v==null||isNaN(v))return '';return (two?nf2:nf0).format(v);}
function pad2(n){return (n<10?'0':'')+n;}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function addDays(iso,n){var p=iso.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function fFecha(iso){if(!iso)return '__/__/____';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fFH(isoTs){if(!isoTs)return '';var d=new Date(isoTs);return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fMes(ym){var p=ym.split('-');return MESES[+p[1]-1]+' '+p[0];}
function skey(o){return o.fecha+'#'+o.turno;}
function nextOf(f,t){return t<3?{fecha:f,turno:t+1}:{fecha:addDays(f,1),turno:0};}
function prevOf(f,t){return t>0?{fecha:f,turno:t-1}:{fecha:addDays(f,-1),turno:3};}
function sum(a){return r2(a.reduce(function(s,v){return s+(v||0);},0));}
function clone(o){return JSON.parse(JSON.stringify(o));}
function slotLabel(o){return fFecha(o.fecha)+' · '+TURNOS[o.turno];}
function slotEnd(o){var p=o.fecha.split('-');return new Date(+p[0],+p[1]-1,+p[2],(o.turno+1)*6,0,0);}
function hhmm(d){return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function uid(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},4200);}
function sha256(txt){
  if(!(window.crypto&&crypto.subtle))return Promise.reject(new Error('Este navegador no permite verificar claves (hace falta https).'));
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});
}
function claveHash(legajo,clave){return sha256('cdu:'+String(legajo).trim()+':'+clave);}
function distKm(a,b){var R=6371,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lon-a.lon)*t,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x));}
function enArtifact(){return /claudeusercontent|claude\.ai/.test(location.hostname)||location.protocol==='file:';}

/* ---------- distritos ---------- */
function D(code){var b=DATA.distritos[code];if(!b)return null;var o=cfg.distOv&&cfg.distOv[code]||{};
  return {code:code,n:b.n,central:!!b.central,cist:clone(o.cist||b.cist),grupos:clone(o.grupos||b.grupos),coords:o.coords||b.coords||null};}
function usinas(){return Object.keys(DATA.distritos).filter(function(k){return !DATA.distritos[k].central;}).sort();}
function distName(code){var d=DATA.distritos[code];return d?code+' · '+d.n:code;}

var DEMO=!cfg.syncUrl&&sget('cpt.modo',enArtifact()?'demo':'nuevo')==='demo';
function cargo(cat){return DATA.jer.filter(function(j){return j.cat===cat;})[0]||{cat:cat,cargo:cat,abrev:''};}
function getUsers(){return sget('cpt.users',null)||[];}
function saveUsers(a){sset('cpt.users',a);}
function userStr(u){return [u.legajo||'?',u.iniciales||'',cargo(u.cat).abrev].join('-');}
function catL(u){return u&&u.cat?u.cat.charAt(0):'';}
function findUser(input){
  var s=String(input||'').trim();if(!s)return {err:'Escribí tu usuario (legajo-iniciales-cargo) o solo el legajo.'};
  var parts=s.split('-'),leg=parts[0].replace(/\D/g,'');
  if(!leg)return {err:'El usuario empieza con el número de legajo. Ejemplo: 3618-mgr-ADMIN.SUP.PRIN.'};
  var u=getUsers().filter(function(x){return String(x.legajo)===leg;})[0];
  if(!u)return {err:'No hay un agente con el legajo '+leg+'. Si es nuevo, un administrador (categoría A) tiene que darlo de alta.'};
  if(u.activo===false)return {err:'El legajo '+leg+' está dado de baja.'};
  if(parts[1]&&u.iniciales&&parts[1].trim().toLowerCase()!==u.iniciales.toLowerCase())return {err:'Las iniciales no coinciden con el legajo '+leg+'.'};
  return {u:u};
}
var ses=sget('cpt.ses',null),sesH=null;

function isB(){return catL(me())==='B';}
function isC(){return catL(me())==='C';}

function seedDemoUsers(){
  var U=clone(DATA.usuarios),nb=9100,cnt={};
  U.forEach(function(u){
    if(u.cat.charAt(0)==='C'){var d=u.dist[0];cnt[d]=(cnt[d]||0)+1;u.legajo=d==='36'?String(1111*cnt[d]):d+pad2(cnt[d]);u.nombre='Operador '+u.nombre;u.iniciales='op'+u.nombre.slice(-4,-3).toLowerCase();}
    else if(!u.legajo){u.legajo=String(nb++);}
    if(!u.iniciales)u.iniciales=u.nombre.split(/\s+/).map(function(w){return w.charAt(0);}).join('').toLowerCase().replace(/[^a-z]/g,'').slice(0,4);
    u.demo=true;
  });
  if(DATA.sim){[['5555','E-36'],['6666','F-36']].forEach(function(x){U.push({legajo:x[0],nombre:'Operador '+x[1],iniciales:'op'+x[1].charAt(0).toLowerCase(),cat:'C-1',dist:['36'],activo:true,demo:true});});}

function verificarClave(u,clave){
  if(DEMO&&u.demo){var ok=catL(u)==='A'?clave==='demo':catL(u)==='B'?clave==='1234':true;return Promise.resolve(ok);}

  return claveHash(u.legajo,clave).then(function(h){if(h===u.h)sesH=h;return h===u.h;});

/* ---------- turnos ---------- */
function migrar(r){if(!r.dist){r.dist=r.distrito==='Perito Moreno'||!r.distrito?'36':r.distrito;}if(!r.distrito||/^\d+$/.test(r.distrito))r.distrito=DATA.distritos[r.dist]?DATA.distritos[r.dist].n:r.distrito;return r;}
function getTurnos(dist){var a=sget('cpt.turnos',[]).map(migrar);return dist?a.filter(function(r){return r.dist===dist;}):a;}
function saveTurnos(a){a.sort(function(x,y){return (x.dist+skey(x))<(y.dist+skey(y))?-1:1;});sset('cpt.turnos',a);}
function upsertTurno(rec){var a=getTurnos();var i=-1;a.forEach(function(x,j){if(x.id===rec.id)i=j;});if(i>=0)a[i]=rec;else a.push(rec);saveTurnos(a);}
function getQueue(){return sget('cpt.queue',[]);}
function queueAdd(k,id,extra){var q=getQueue();if(!q.some(function(x){return x.k===k&&x.id===id;}))q.push(Object.assign({k:k,id:id},extra||{}));sset('cpt.queue',q);}
function queueDel(k,id){sset('cpt.queue',getQueue().filter(function(x){return !(x.k===k&&x.id===id);}));}
function inQueue(k,id){return getQueue().some(function(x){return x.k===k&&x.id===id;});}
function currentSlot(dist){
  var c=[],a=getTurnos(dist).filter(function(r){return !r.hist;});
  if(a.length){var l=a[a.length-1];c.push({fecha:l.fecha,turno:l.turno,total:l.total,pri:inQueue('turno',l.id)?2:0});}
  var r=sget('cpt.remote.'+dist,null);if(r)c.push({fecha:r.fecha,turno:r.turno,total:r.total,pri:1});
  var b=sget('cpt.base.'+dist,null);if(b){var p=prevOf(b.fecha,b.turno);c.push({fecha:p.fecha,turno:p.turno,total:b.inicio});}
  if(!c.length)return null;
  c.sort(function(x,y){var a1=skey(x),b1=skey(y);if(a1!==b1)return a1<b1?1:-1;return (y.pri||0)-(x.pri||0);});
  var n=nextOf(c[0].fecha,c[0].turno);return {fecha:n.fecha,turno:n.turno,inicio:c[0].total};
}
function recId(dist,f,t){return 'D'+dist+'_'+f+'_T'+(t+1);}

function getInformes(dist){var a=sget('cpt.informes',[]);return dist?a.filter(function(x){return x.dist===dist;}):a;}
function saveInformes(a){a.sort(function(x,y){return (x.creado||'')<(y.creado||'')?1:-1;});sset('cpt.informes',a);}
function upsertInforme(inf){var a=getInformes();var i=-1;a.forEach(function(x,j){if(x.id===inf.id)i=j;});if(i>=0)a[i]=inf;else a.push(inf);saveInformes(a);if(!inf.demo)queueAdd('informe',inf.id);}
function nuevoNumInforme(dist,anio){var n=getInformes(dist).filter(function(x){return x.anio===anio&&x.tipo!=='Resumen mensual';}).reduce(function(m,x){return Math.max(m,x.num||0);},0)+1;return n;}
function crearInforme(o){

    creadoPor:u?{legajo:u.legajo,nombre:u.nombre,cat:u.cat}:null,tipo:'Otro',fechaHecho:todayISO(),turnos:[],titulo:'',descripcion:'',equipo:'',accion:'',estadoEquipo:'',
    correcciones:[],fotos:[],firmas:{},estado:'pendiente',origen:'manual',historial:[],demo:DEMO},o);

  upsertInforme(inf);return inf;

/* ---------- reglas de cálculo ---------- */
function newTruck(){var c=[];for(var i=0;i<NCAM;i++)c.push(null);var e=[],o=[];for(var j=0;j<NCAM;j++){e.push('');o.push('');}return {hora:'',remito:'',litros:null,op:'',entrega:'',fecha:'',cist:c,est:e,dest:o,corregido:false,foto:null,parcial:false,excl:[],motivo:''};}
function newDraft(dist,slot){var n=D(dist).cist.length,e=[];for(var i=0;i<n;i++)e.push(null);return {dist:dist,slot:slot,recibe:'',obs:'',camiones:[],exist:e,grupos:[],servicio:null,anom:null,firma:null,fotoCaud:null,gps:{}};}
function calcD(d){var ing=sum(d.camiones.map(function(c){return c.litros;}));var all=d.exist.every(function(v){return v!=null;});var tot=sum(d.exist);return {ingresos:ing,total:tot,consumo:r2(d.slot.inicio+ing-tot),allExist:all};}
function isRound(v){return v!=null&&v>0&&Math.abs(v%1000)<1e-9;}
function tStarted(c){return !!(c.hora||c.remito||c.litros!=null);}
function estDe(c,k){var e=c.est&&c.est[k];if(e)return e;return (c.cist[k]||0)>0?'d':'';}
function tSum(c){return sum(c.cist.filter(function(v,k){return estDe(c,k)==='d';}));}
function camEstados(c){var v=c.cisternas||c.cist||[];return v.map(function(x,k){var e=c.estados&&c.estados[k]||c.est&&c.est[k];return e||((x||0)>0?'d':'v');});}
function tJustified(c){var s=tSum(c);return c.corregido&&s>0&&c.litros!=null&&Math.abs(c.litros-s)<0.005;}
function estOk(c){for(var k=0;k<NCAM;k++){var e=estDe(c,k),v=c.cist[k]||0;if(!e)return false;if(e==='d'&&!(v>0))return false;if(e!=='d'&&v>0)return false;if(e==='o'&&!(c.dest&&c.dest[k]))return false;}return true;}
function tH2Ok(c){return !!String(c.op).trim()&&!!String(c.entrega).trim()&&tJustified(c)&&estOk(c);}
function remitoOk(r){return /^\d{4}-\d{8}$/.test(r||'');}
function horaEnTurno(h,t){if(!h)return true;var hh=+h.slice(0,2);return hh>=t*6&&hh<(t+1)*6;}
function fmtRemito(v){var d=String(v).replace(/\D/g,'');if(d.length>4)return d.slice(0,4)+'-'+d.slice(4,12);return d;}
function remNum(r){return Number(String(r).replace(/\D/g,''));}
function fechaRemitoAviso(t,fIng){if(!t.fecha)return '';if(t.fecha>fIng)return 'Fecha del remito posterior al ingreso';var dd=(new Date(fIng)-new Date(t.fecha))/864e5;if(dd>3)return 'Remito emitido hace '+Math.round(dd)+' días';return '';}
function iguales(ex,cist){var out=[];for(var i=0;i<ex.length;i++)for(var j=i+1;j<ex.length;j++){if(ex[i]!=null&&ex[i]===ex[j]&&ex[i]>=1000)out.push(cist[i].n+' y '+cist[j].n);}return out;}

   PANTALLA DEL TURNO (categoría C) y editor de turnos cerrados (B)

var DR=null,page=1,editing=null,editSol=null,editBack=null;

function draftKey(dist){return 'cpt.draft.'+dist;}
function hasContent(d){return d&&(d.obs||d.recibe||d.camiones.length||d.exist.some(function(v){return v!=null;})||d.firma||(d.grupos&&d.grupos.length));}
function loadDraft(dist,silent){
  var slot=currentSlot(dist);if(!slot){DR=null;return;}
  var d=sget(draftKey(dist),null);
  if(d&&d.slot&&skey(d.slot)===skey(slot)&&d.exist&&d.exist.length===D(dist).cist.length){d.slot.inicio=slot.inicio;DR=d;}
  else{if(d&&d.slot&&hasContent(d)&&!silent)toast('El turno '+slotLabel(d.slot)+' ya figura cerrado. Se abrió el turno siguiente.');DR=newDraft(dist,slot);sset(draftKey(dist),DR);page=1;}
}
function persist(){if(!editing&&DR)sset(draftKey(DR.dist),DR);}
function CI(){return D(DR.dist).cist;}

/* ---------- GPS ---------- */
function getPos(){return new Promise(function(res){
  if(!navigator.geolocation){res({sin:true,motivo:'El dispositivo no tiene GPS disponible'});return;}
  var done=false,t=setTimeout(function(){if(!done){done=true;res({sin:true,motivo:'Sin respuesta del GPS'});}},9000);
  try{navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy),ts:new Date().toISOString()});},
    function(e){if(done)return;done=true;clearTimeout(t);res({sin:true,motivo:e.code===1?'GPS sin permiso':'GPS apagado o sin señal'});},{enableHighAccuracy:true,timeout:8000,maximumAge:60000});}
  catch(e){done=true;clearTimeout(t);res({sin:true,motivo:'GPS no disponible'});}
});}
function gpsTxt(g,dist){
  if(!g)return '—';
  if(g.sin)return (g.motivo||'Sin GPS')+' · se registra el distrito '+distName(dist);
  var t='Lat '+g.lat.toFixed(5)+', Lon '+g.lon.toFixed(5)+' (±'+g.acc+' m)';
  var c=D(dist).coords;if(c&&c.lat!=null){var km=distKm(g,c);t+=' · '+(km<1?Math.round(km*1000)+' m':fmt(Math.round(km*10)/10)+' km')+' de la usina';}
  return t;
}
function gpsFuera(g,dist){var c=D(dist).coords;return !!(g&&!g.sin&&c&&c.lat!=null&&distKm(g,c)>1);}

/* ---------- validación ---------- */
function remitosUsados(dist){var m={};getTurnos(dist).forEach(function(t){if(editing&&t.id===editing)return;(t.camiones||[]).forEach(function(c){m[c.remito]=t;});});return m;}
function maxRemito(dist){var mx=null;getTurnos(dist).forEach(function(t){if(editing&&t.id===editing)return;(t.camiones||[]).forEach(function(c){if(remitoOk(c.remito)&&(!mx||remNum(c.remito)>remNum(mx)))mx=c.remito;});});return mx;}
function problems(d){
  var p=[],c=calcD(d),used=remitosUsados(d.dist),seen={},ci=D(d.dist).cist;
  d.camiones.forEach(function(t,i){var n='Camión '+(i+1)+': ';
    if(!t.hora)p.push({h:1,m:n+'falta el horario'});
    if(!remitoOk(t.remito))p.push({h:1,m:n+'el remito debe tener el formato 0000-00000000'});
    else{if(seen[t.remito])p.push({h:1,m:n+'remito repetido en este turno'});seen[t.remito]=1;if(used[t.remito])p.push({h:1,m:n+'el remito '+t.remito+' ya se cargó en el turno '+slotLabel(used[t.remito])});}
    if(!(t.litros>0))p.push({h:1,m:n+'faltan los litros'});});
  d.exist.forEach(function(v,i){if(v==null)p.push({h:1,m:'Falta la existencia de '+ci[i].n});else if(v<0)p.push({h:1,m:ci[i].n+': la existencia no puede ser negativa'});else if(v>ci[i].cap)p.push({h:1,m:ci[i].n+' supera su capacidad ('+fmt(ci[i].cap)+' L)'});});
  if(!editing){
    if(!d.grupos||!d.grupos.length)p.push({h:1,m:'Marcá los grupos generadores que estuvieron en marcha'});
    if(d.servicio==null)p.push({h:1,m:'Elegí la cisterna en servicio'});
    if(d.anom&&!String(d.anom.desc||'').trim())p.push({h:1,m:'Describí la anomalía'});
  }
  d.camiones.forEach(function(t,i){if(!tStarted(t))return;var n='Hoja 2 · Camión '+(i+1)+': ';
    if(!String(t.op).trim())p.push({h:2,m:n+'falta OP = Pedido'});
    if(!String(t.entrega).trim())p.push({h:2,m:n+'falta Entrega/Reserva'});
    if(!(tSum(t)>0))p.push({h:2,m:n+'faltan los litros de las cisternas'});else if(!tJustified(t))p.push({h:2,m:n+'tocá «Corregir Litros»'});
    for(var k=0;k<NCAM;k++){var e=estDe(t,k),v=t.cist[k]||0;
      if(!e)p.push({h:2,m:n+'cisterna '+(k+1)+': elegí si vino vacía o si sigue a otro distrito'});
      else if(e==='d'&&!(v>0))p.push({h:2,m:n+'cisterna '+(k+1)+': marcada como descargada pero sin litros'});
      else if(e==='o'&&!(t.dest&&t.dest[k]))p.push({h:2,m:n+'cisterna '+(k+1)+': elegí el distrito de destino'});}
    if(t.parcial&&!String(t.motivo||'').trim())p.push({h:2,m:n+'explicá por qué la descarga fue parcial'});
    if(cfg.fotoRemito&&!t.foto&&!editing)p.push({h:2,m:n+'falta la foto del remito'});});
  if(cfg.fotoCaud&&!d.fotoCaud&&!editing)p.push({h:1,m:'Falta la foto de los caudalímetros'});
  if(c.allExist&&c.consumo<0&&!d.obs.trim())p.push({h:1,m:'El consumo da negativo: explicá la causa en Observación'});
  if(!editing){
    if(!d.firma)p.push({h:0,m:'Falta la firma'});
    var fin=slotEnd(d.slot),desde=new Date(fin.getTime()-(cfg.minAntes||0)*60000);
    if(new Date()<desde)p.unshift({h:0,m:'El turno termina a las '+hhmm(fin)+'. Se puede cerrar desde las '+hhmm(desde)+'.'});
  }
  return p;
}
function h2Pending(d){return d.camiones.some(function(t){return tStarted(t)&&!tH2Ok(t);});}

function makePad(cv,get,set){
  var ctx=cv.getContext('2d'),drawn=false,last=null;
  function size(){var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#101820';var f=get();if(f&&String(f).indexOf('data:')===0){var im=new Image();im.onload=function(){ctx.drawImage(im,0,0,r.width,r.height);};im.src=f;}}
  size();cv._resize=size;
  function pt(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();cv.setPointerCapture(e.pointerId);last=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y+.1);ctx.stroke();drawn=true;});
  cv.addEventListener('pointermove',function(e){if(!last)return;var p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  function end(){if(!last)return;last=null;if(drawn){var o=document.createElement('canvas');o.width=420;o.height=Math.round(420*cv.height/cv.width);var oc=o.getContext('2d');oc.fillStyle='#ffffff';oc.fillRect(0,0,o.width,o.height);oc.drawImage(cv,0,0,o.width,o.height);set(o.toDataURL('image/png'));}}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  return {clear:function(){ctx.clearRect(0,0,cv.width,cv.height);drawn=false;set(null);}};
}
function setupPad(){var cv=$('#pad');if(!cv)return;var p=makePad(cv,function(){return DR.firma;},function(v){DR.firma=v;persist();refreshTurno();});$('#padClear').addEventListener('click',p.clear);}

    '<div class="field"><label for="pcTxt">Qué corregir</label><textarea id="pcTxt" rows="4" placeholder="Ejemplo: en C3 anoté 44.000 y era 44.410"></textarea></div><div class="row-end"><button class="btn" data-close type="button">Cancelar</button><button class="btn primary" id="pcGo" type="button">Enviar pedido</button></div>',true);
  $('#pcGo').addEventListener('click',function(){var t=$('#pcTxt').value.trim();if(!t){toast('Escribí qué hay que corregir.');return;}var u=me();
    var a=getTurnos();a.forEach(function(r){if(r.id===id){r.solicitudes=(r.solicitudes||[]).concat([{id:uid('S'),texto:t,por:u.nombre,legajo:u.legajo,cuando:new Date().toISOString(),estado:'pendiente'}]);if(!r.demo){r.sync='pendiente';queueAdd('turno',r.id);}}});

function modalRedeclarar(id,i){
  var r=getTurnos().filter(function(x){return x.id===id;})[0],t=r.camiones[i],cs='';
  for(var k=0;k<NCAM;k++)cs+='<div class="field"><label for="rdC'+k+'">Cisterna '+(k+1)+'</label><input id="rdC'+k+'" class="num" inputmode="decimal" value="'+fmt(t.cisternas[k])+'"></div>';
  openModal('<h3>Redeclarar camión '+esc(t.remito)+'</h3><p class="hint">Salvataje de la declaración: corregí la hora real y los litros descargados según el remito. El cambio queda asentado en el informe de observación y anomalías.</p>'+
    '<div class="form-grid"><div class="field"><label for="rdHora">Hora real de la descarga</label><input id="rdHora" type="time" value="'+esc(t.hora)+'"></div>'+cs+
    '<label class="check full"><input type="checkbox" id="rdPar"'+(t.parcial?' checked':'')+'> Descarga parcial</label><div class="field full"><label for="rdMot">Motivo / detalle</label><input id="rdMot" value="'+esc(t.motivo||'')+'" placeholder="Ejemplo: quedó afuera la cisterna 7 por falta de capacidad; terminó la descarga el operador del turno siguiente"></div></div>'+
    '<p class="hint" id="rdSum"></p><div class="row-end"><button class="btn" data-close type="button">Cancelar</button><button class="btn primary" id="rdGo" type="button">Guardar redeclaración</button></div>',true);
  function vals(){var v=[];for(var k=0;k<NCAM;k++)v.push(parseAR($('#rdC'+k).value)||0);return v;}
  function upd(){$('#rdSum').textContent='Total redeclarado: '+fmt(sum(vals()),true)+' L (antes '+fmt(t.litros,true)+' L).';}
  $('#modalCard').addEventListener('input',upd);upd();
  $('#rdGo').addEventListener('click',function(){var v=vals(),tot=sum(v),u=me();if(!(tot>0)){toast('Cargá los litros de las cisternas.');return;}
    var a=getTurnos(),rec=a.filter(function(x){return x.id===id;})[0],c=rec.camiones[i],antes={hora:c.hora,litros:c.litros,parcial:!!c.parcial,motivo:c.motivo},mot=$('#rdMot').value.trim();
    c.hora=$('#rdHora').value||c.hora;c.cisternas=v;c.litros=tot;c.parcial=$('#rdPar').checked;c.motivo=mot;
    rec.ingresos=sum(rec.camiones.map(function(x){return x.litros;}));var oc=rec.consumo;rec.consumo=r2(rec.inicio+rec.ingresos-rec.total);
    var cambios=[];if(antes.hora!==c.hora)cambios.push('Camión '+c.remito+': hora '+antes.hora+' → '+c.hora);if(antes.litros!==tot)cambios.push('Camión '+c.remito+': litros '+fmt(antes.litros,true)+' → '+fmt(tot,true));if(oc!==rec.consumo)cambios.push('Consumo '+fmt(oc,true)+' → '+fmt(rec.consumo,true));
    if(antes.parcial!==c.parcial)cambios.push('Camión '+c.remito+': '+(c.parcial?'descarga parcial':'descarga completa'));
    if(!cambios.length&&mot===(antes.motivo||'')){toast('No hay cambios para redeclarar.');return;}if(!cambios.length)cambios.push('Camión '+c.remito+': detalle actualizado');
    rec.ediciones=(rec.ediciones||[]).concat([{cuando:new Date().toISOString(),por:u.nombre+' ('+u.cat+')',cambios:['Redeclaración'].concat(cambios)}]);
    rec.observacion=(rec.observacion?rec.observacion+'\n':'')+'[Redeclaración del camión '+c.remito+' por '+u.nombre+' el '+fFH(new Date().toISOString())+(mot?': '+mot:'')+']';
    if(!rec.demo){rec.sync='pendiente';queueAdd('turno',rec.id);}
    var inf=crearInforme({dist:rec.dist,tipo:'Redeclaración de camión',fechaHecho:rec.fecha,turnos:[rec.id],titulo:'Redeclaración del camión '+c.remito,
      descripcion:(mot||'Redeclaración de la descarga')+'. Declarado originalmente '+fmt(antes.litros,true)+' L a las '+antes.hora+'; real '+fmt(tot,true)+' L a las '+c.hora+' según el remito '+c.remito+'.',
      origen:'redeclaracion',estado:'pendiente',agentes:[{legajo:rec.legajo,nombre:rec.aclaracion}],correcciones:cambios.map(function(x){return {campo:x,por:u.nombre,cuando:new Date().toISOString()};})});
    rec.informes=(rec.informes||[]).concat([inf.id]);cascade(a,rec.dist);saveTurnos(a);closeModal();toast('Camión redeclarado. Quedó asentado en el informe '+informeLabel(inf)+'.');sync(false);render();});
}

/* ---------- telemetría ---------- */
function openTel(id){
  var r=getTurnos().filter(function(x){return x.id===id;})[0];if(!r)return;var ti=telIdx(r.dist),cn=r.cistN||D(r.dist).cist.map(function(c){return c.n;});

  openModal('<h3>Telemetría · '+esc(slotLabel(r))+'</h3><p class="hint">Valores de la telemetría a las <b>'+hora+'</b> del '+fFecha(r.turno===3?addDays(r.fecha,1):r.fecha)+'. Operador: '+esc(r.aclaracion)+'.</p>'+
    '<div class="tablewrap"><table><thead><tr><th>Cisterna</th><th>Operador</th><th>Telemetría</th><th>Diferencia</th></tr></thead><tbody>'+
    r.existencias.map(function(v,i){var k=ti.indexOf(i);return '<tr><td>'+esc(cn[i])+'</td><td class="n">'+fmt(v)+'</td><td>'+(k>=0?'<input id="tv'+k+'" class="num" inputmode="decimal" value="'+fmt(tv[k])+'" style="max-width:140px">':'<span class="hint">Sin telemetría</span>')+'</td><td class="n" id="td'+i+'">—</td></tr>';}).join('')+
    '</tbody></table></div><div class="row-end"><button class="btn" data-close type="button">Volver</button><button class="btn primary" id="telSave" type="button">Guardar telemetría</button></div>',true);
  function upd(){ti.forEach(function(ix,k){var v=parseAR($('#tv'+k).value),td=$('#td'+ix);if(v==null){td.textContent='—';td.className='n';return;}var d=r2(r.existencias[ix]-v);td.textContent=(d>0?'+':'')+fmt(d);td.className='n '+(Math.abs(d)>cfg.tolL?'cbad':'');});}
  $('#modalCard').addEventListener('input',upd);upd();
  $('#telSave').addEventListener('click',function(){var v=[];for(var k=0;k<ti.length;k++){var x=parseAR($('#tv'+k).value);if(x==null||x<0){toast('Completá la telemetría de '+cn[ti[k]]+'.');return;}v.push(x);}
    var a=getTurnos(),u=me();a.forEach(function(t){if(t.id===id){var ant=!!(t.telemetria&&t.telemetria.v);t.telemetria={v:v,cargado:new Date().toISOString(),por:u.nombre};
      t.ediciones=(t.ediciones||[]).concat([{cuando:new Date().toISOString(),por:u.nombre+' ('+u.cat+')',cambios:[(ant?'Telemetría corregida: ':'Telemetría cargada: ')+v.map(function(x){return fmt(x);}).join(' / ')]}]);if(!t.demo){t.sync='pendiente';queueAdd('turno',t.id);}}});
    saveTurnos(a);closeModal();toast('Telemetría guardada.');sync(false);render();});
}

function subirHist(){
  var o=histImp,meta=histMeta(),loc={};getTurnos().forEach(function(r){loc[r.id]=r;});

  if(!cfg.syncUrl||!navigator.onLine){toast(!cfg.syncUrl?'Falta la dirección del servidor.':'Sin conexión: el histórico se sube con internet.');btn.setAttribute('aria-disabled','false');return;}
  guardarLocal();

  cfs.forEach(function(c){ch=ch.then(function(){prog(hechos,tot,'Subiendo control físico de '+fMes(c.mes)+'…');return postJSON({accion:'guardarCF',cf:c,auth:auth}).then(function(){hechos++;});});});

    .catch(function(e){st.textContent='Se cortó en el paso '+(hechos+1)+' de '+tot+': '+e.message+'. Volvé a tocar «Subir»: lo que ya subió se reemplaza sin duplicarse.';btn.setAttribute('aria-disabled','false');});

function enviar(item){
  if(item.k==='turno'){var rec=getTurnos().filter(function(r){return r.id===item.id;})[0];if(!rec||rec.demo)return Promise.resolve();
    return subirFotos(rec).then(function(){var r2_=getTurnos().filter(function(r){return r.id===item.id;})[0];return postJSON({accion:'guardarTurno',turno:r2_,auth:item.auth||null});}).then(function(){var b=getTurnos();b.forEach(function(r){if(r.id===item.id)r.sync='ok';});saveTurnos(b);});}
  if(item.k==='informe'){var inf=getInformes().filter(function(x){return x.id===item.id;})[0];if(!inf||inf.demo)return Promise.resolve();return postJSON({accion:'guardarInforme',informe:inf});}
  if(item.k==='usuario'){var u=getUsers().filter(function(x){return String(x.legajo)===String(item.id);})[0];if(!u)return Promise.resolve();return postJSON({accion:'guardarUsuario',usuario:u,auth:item.auth});}

}
function pullConfig(){return getJSON({accion:'config'}).then(function(res){if(res.config){var c=res.config;if(!getQueue().some(function(x){return x.k==='config';})){['distOv','tolL','tolP','fotoRemito','fotoCaud','minAntes','horasTarde'].forEach(function(k){if(c[k]!=null)cfg[k]=c[k];});Object.keys(c.bases||{}).forEach(function(d){var nb=c.bases[d],lb=sget('cpt.base.'+d,null);if(!lb||!lb.ts||nb.ts>lb.ts){var vieja=!lb||!lb.ts||nb.ts>lb.ts;sset('cpt.base.'+d,nb);if(vieja&&lb&&lb.ts){saveTurnos(getTurnos().filter(function(r){return r.dist!==d||r.hist||skey(r)>=skey(nb);}));}}});cfg.bases=c.bases||{};saveCfg();}}}).catch(function(){});}
function pullUsers(){return getJSON({accion:'usuarios'}).then(function(res){var pend=getQueue().filter(function(x){return x.k==='usuario';}).map(function(x){return String(x.id);}),loc=getUsers();
  var a=(res.usuarios||[]).map(function(u){return pend.indexOf(String(u.legajo))>=0?(loc.filter(function(x){return String(x.legajo)===String(u.legajo);})[0]||u):u;});
  loc.forEach(function(u){if(pend.indexOf(String(u.legajo))>=0&&!a.some(function(x){return String(x.legajo)===String(u.legajo);}))a.push(u);});saveUsers(a);});}
function sync(manual){
  if(DEMO){if(manual)toast('Modo demostración: no hay servidor. Conectalo desde la pantalla de ingreso.');updatePill();return Promise.resolve();}
  if(syncing)return Promise.resolve();
  if(!cfg.syncUrl){if(manual)toast('Falta la dirección del servidor.');updatePill();return Promise.resolve();}
  if(!navigator.onLine){if(manual)toast('Sin conexión. Todo queda guardado y se envía al volver internet.');updatePill();return Promise.resolve();}
  syncing=true;updatePill();
  var chain=Promise.resolve();
  getQueue().forEach(function(item){chain=chain.then(function(){return enviar(item).then(function(){queueDel(item.k,item.id);});});});
  return chain.then(function(){return Promise.all([pullUsers(),pullConfig()]);}).then(function(){
    var ds=me()?(isC()?[me().dist[0]]:misDistritos()):(cfg.devDist?[cfg.devDist]:[]);
    return getJSON({accion:'estado',distritos:ds.join(',')}).then(function(st){Object.keys(st.ultimos||{}).forEach(function(d){var u=st.ultimos[d];if(u)sset('cpt.remote.'+d,{fecha:u.fecha,turno:+u.turno,total:+u.total});});});
  }).then(function(){prune();lastErr=null;if(manual)toast('Sincronización completa.');})
  .catch(function(e){lastErr=e.message;if(manual)toast('No se pudo sincronizar: '+e.message);})
  .then(function(){syncing=false;updatePill();
    if(ses&&me()&&VIEW==='turno'&&!editing&&DR){var s=currentSlot(DR.dist);if(s&&skey(s)!==skey(DR.slot)){loadDraft(DR.dist,false);render();}else if(s&&s.inicio!==DR.slot.inicio){DR.slot.inicio=s.inicio;persist();render();}}
    else if(ses&&me()&&VIEW==='turno'&&!DR){render();}});
}
function downloadMonth(dist,mes){

    var qc=getQueue(),lc=getCFs(),ic={};lc.forEach(function(x,i){ic[x.id]=i;});(rs[2].cfs||[]).forEach(function(x){if(qc.some(function(y){return y.k==='cf'&&y.id===x.id;}))return;if(ic[x.id]!=null)lc[ic[x.id]]=x;else lc.push(x);});saveCFs(lc);

    var b=getInformes(),ix={};b.forEach(function(x,i){ix[x.id]=i;});(rs[1].informes||[]).forEach(function(x){if(q.some(function(y){return y.k==='informe'&&y.id===x.id;}))return;if(ix[x.id]!=null)b[ix[x.id]]=x;else b.push(x);});saveInformes(b);
    toast(n+' turno(s) y '+(rs[1].informes||[]).length+' informe(s) actualizados.');render();}).catch(function(e){toast('No se pudo traer: '+e.message);});

function prune(){var lim=addDays(todayISO(),-DIAS_LOCAL),a=getTurnos(),q=getQueue();var keep=a.filter(function(t){return q.some(function(x){return x.k==='turno'&&x.id===t.id;})||t.fecha>=lim||t.demo||t.fecha.slice(0,7)===CMES||t.fecha.slice(0,7)===mesAnt(CMES);});
  var last={};a.forEach(function(t){if(!t.hist)last[t.dist]=t;});Object.keys(last).forEach(function(d){if(keep.indexOf(last[d])<0)keep.push(last[d]);});if(keep.length!==a.length)saveTurnos(keep);}

<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d5f73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Combustible">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Combustible por Turno</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una planilla centrada (máx. 680px) con marco de doble línea como el formulario en papel; barra de acción fija abajo */
:root{
  --bg:#e8ecf0; --sheet:#fbfcfd; --ink:#16212c; --muted:#5a6774; --line:#c6cfd8; --rule:#22303d;
  --accent:#0d5f73; --accent-ink:#ffffff; --accent-soft:#dcebf0;
  --danger:#b3261e; --danger-ink:#ffffff; --danger-bg:#fbe4e2;
  --ok:#1b6e3a; --ok-bg:#dff1e5; --warn:#8a5300; --warn-bg:#fdf0d5;
  --field:#f1f4f7; --pad-bg:#ffffff; --pad-ink:#101820; --shadow:0 1px 2px rgba(20,30,40,.08),0 6px 20px rgba(20,30,40,.07);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --sheet:#17202a; --ink:#e3e9ef; --muted:#97a4b1; --line:#2f3c48; --rule:#9fb0c0;
  --accent:#5fb6c9; --accent-ink:#06222a; --accent-soft:#163542;
  --danger:#ff7b72; --danger-ink:#2a0b09; --danger-bg:#3d1b1a;
  --ok:#7fd49b; --ok-bg:#163223; --warn:#f2bf5e; --warn-bg:#3a2c10;
  --field:#111921; --pad-bg:#ffffff; --pad-ink:#101820; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --sheet:#17202a; --ink:#e3e9ef; --muted:#97a4b1; --line:#2f3c48; --rule:#9fb0c0;
  --accent:#5fb6c9; --accent-ink:#06222a; --accent-soft:#163542;
  --danger:#ff7b72; --danger-ink:#2a0b09; --danger-bg:#3d1b1a;
  --ok:#7fd49b; --ok-bg:#163223; --warn:#f2bf5e; --warn-bg:#3a2c10;
  --field:#111921; --pad-bg:#ffffff; --pad-ink:#101820; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);margin:0}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0;min-height:100%;display:flex;flex-direction:column}

/* Barra superior */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font:700 1.15rem/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font:500 .72rem/1.3 var(--f-body);letter-spacing:.02em;text-transform:none;color:var(--muted)}
.tb-right{display:flex;align-items:center;gap:8px}
.pill{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.err{background:var(--danger-bg);color:var(--danger);border-color:transparent}

.banner{border:1px solid var(--line);background:var(--accent-soft);padding:10px 12px;border-radius:6px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.banner.edit{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600}

/* Planilla */
.sheet{display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.frame{background:var(--sheet);border:4px double var(--rule);padding:16px;box-shadow:var(--shadow)}
.frame-in{display:flex;flex-direction:column;gap:16px}
.head{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px}
.fecha{font:600 1.05rem var(--f-display);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.distrito{font-size:.95rem;text-align:right}
.distrito u{font-weight:600}
.distrito b{font-weight:600}
.turno{grid-column:1/-1;text-align:center;font:700 clamp(1.6rem,6vw,2.1rem)/1.1 var(--f-display);margin:6px 0 0;letter-spacing:.02em;text-wrap:balance}
.turno u{text-underline-offset:4px;text-decoration-thickness:2px}
.hoja-tag{grid-column:1/-1;text-align:center;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

.kv{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;border:1px dashed var(--rule);padding:10px 12px}
.kv .lbl{font:700 .95rem var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.kv .val{font:600 1.25rem var(--f-body);font-variant-numeric:tabular-nums;text-align:right;font-style:italic}
.kv .unit,.unit{font-size:.8rem;color:var(--muted);font-style:italic}
.kv.solid{border-style:solid;border-width:2px}
.kv.neg .val{color:var(--danger)}

.sec{font:700 1.05rem var(--f-display);letter-spacing:.03em;display:block;margin-bottom:6px}
.sec small{font:500 .8rem var(--f-body);color:var(--muted);letter-spacing:0;margin-left:4px}
textarea,input[type=text],input[type=time],input[type=password],input:not([type]),select{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:9px 10px;outline:none}
textarea{resize:vertical;background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);line-height:32px;padding-top:0}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
input[readonly]{background:transparent;border-style:dashed}

/* Camiones Hoja 1 */
.trucks{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:minmax(84px,.8fr) minmax(0,1.5fr) minmax(0,1.2fr) 40px;gap:6px;align-items:center}
.trow input{font-style:italic;font-weight:600}
.tflags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.tflags:empty{display:none}
.round{background:var(--danger)!important;color:var(--danger-ink)!important;border-color:var(--danger)!important}
.bad{border-color:var(--danger)!important;box-shadow:inset 0 0 0 1px var(--danger)}
.chip{font:600 .72rem var(--f-body);padding:2px 8px;border-radius:999px;background:var(--field);color:var(--muted);border:1px solid var(--line);letter-spacing:.01em}
.chip.r{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.chip.g{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.y{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.empty{margin:0;color:var(--muted);font-size:.9rem;font-style:italic}
.x{width:40px;height:40px;border:1px solid var(--line);background:transparent;border-radius:4px;cursor:pointer;font-size:1.2rem;line-height:1;color:var(--muted)}
.x.arm{background:var(--danger);color:var(--danger-ink);border-color:var(--danger);font-size:.68rem;font-weight:700}
.add{align-self:flex-start;margin-top:8px;border:1px dashed var(--accent);color:var(--accent);background:transparent;padding:8px 12px;border-radius:4px;cursor:pointer;font-weight:600}

/* Cisternas de la usina */
.tanks{display:flex;flex-direction:column;border:2px solid var(--rule)}
.tank{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,42%);align-items:center;border-bottom:1px solid var(--rule);position:relative}
.tank:last-child{border-bottom:0}
.tank label{padding:8px 10px;font-weight:600;font-size:.95rem;border-right:1px solid var(--rule)}
.tank label small{color:var(--muted);font-weight:500}
.tank-in{display:flex;align-items:center;gap:6px;padding:4px 8px}
.tank-in input{border:0;background:transparent;padding:6px 4px;font-size:1.05rem}
.gauge{position:absolute;left:0;bottom:0;height:3px;width:100%;pointer-events:none}
.gauge i{display:block;height:100%;width:0;background:var(--accent);opacity:.55;transition:width .25s}
.gauge i.over{background:var(--danger);opacity:1}

/* Hoja 2 */
.h2truck{border-top:2px dotted var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.h2truck h2{margin:0;font:700 1.15rem var(--f-display);letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-style:italic}
.h2grid{display:grid;grid-template-columns:minmax(120px,40%) minmax(0,1fr);gap:6px 10px;align-items:center}
.h2grid label,.h2grid .l{font-weight:700;font-size:.95rem}
.h2grid output{font-weight:600;font-variant-numeric:tabular-nums;padding:8px 10px;border:1px dashed var(--line);border-radius:4px}
.cist{display:grid;grid-template-columns:minmax(100px,40%) minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.cist label{font-weight:700;font-size:.95rem}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.corr{align-self:flex-end;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:9px 14px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.corr.need{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Firma */
.firma{background:var(--sheet);border:1px dashed var(--rule);padding:14px;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.pad-wrap{position:relative}
#pad{display:block;width:100%;height:130px;background:var(--pad-bg);border:1px solid var(--line);border-radius:4px;touch-action:none;cursor:crosshair}
.pad-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.pad-hint{font-size:.8rem;color:var(--muted)}
.firma-cap{text-align:center;font-weight:700;text-decoration:underline;font-size:.95rem}
.firma-img{max-width:100%;height:110px;object-fit:contain;background:var(--pad-bg);border:1px solid var(--line);border-radius:4px;display:block}

/* Botones y barra de acción */
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.goto{background:var(--danger);color:var(--danger-ink);border-color:var(--danger)}
.btn[aria-disabled="true"]{opacity:.5}
.btn.small,.ghost.small{padding:6px 10px;font-size:.85rem}
.ghost{border:1px solid var(--line);background:transparent;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}
.actionbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:auto}
.status{font-size:.85rem;color:var(--muted);flex:1 1 200px;min-width:0}
.status b{color:var(--ink)}
.actions{display:flex;gap:8px;margin-left:auto}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:20}
.modal-card{background:var(--sheet);border:4px double var(--rule);width:100%;max-width:1080px;padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-card h3{margin:0;font:700 1.35rem var(--f-display);letter-spacing:.03em}
.modal-card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font:700 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--field)}
td.n{text-align:right}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.summary{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}
.summary b{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:6px;font-size:.9rem;max-width:calc(100% - 32px);z-index:30;box-shadow:var(--shadow)}

.src{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;margin-left:2px;vertical-align:1px;white-space:nowrap}
.src.t{background:var(--accent-soft);color:var(--accent)}
.src.r{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.ctl-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.ctl-bar .field{min-width:160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctl-sum{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.9rem;font-variant-numeric:tabular-nums}
td.cbad{background:var(--danger-bg);color:var(--danger);font-weight:700}
tr.row-bad td:first-child{box-shadow:inset 4px 0 0 var(--danger)}
td.wrap{white-space:normal;min-width:220px}
td.wrap .chip{display:inline-block;margin:1px 0}
.telt input{max-width:140px}
.foto-box{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;border:1px dashed var(--line);border-radius:6px;padding:8px}
.foto-thumb{width:96px;height:72px;border-radius:4px;background:var(--field);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:.8rem;text-align:center}
.foto-thumb img{width:100%;height:100%;object-fit:cover}
.foto-empty{color:var(--muted);font-size:.78rem}
.foto-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.foto-btns{display:flex;gap:6px;flex-wrap:wrap}
.foto-txt>.chip{align-self:flex-start}
.check{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.9rem}
.check input{width:18px;height:18px}
.fl{margin-top:4px;font-size:.82rem}
.fl a{color:var(--accent);font-weight:600}
@media (max-width:460px){
  .frame{padding:12px}
  .trow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px}
  .trow input[type=time]{grid-column:1}
  .trow [id^=tr]{grid-column:2/4}
  .trow [id^=tl]{grid-column:1/3}
  .trow .x{grid-column:3;grid-row:2}
  .grid2{grid-template-columns:1fr}
  .tank{grid-template-columns:minmax(0,1fr) minmax(110px,46%)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Combustible por turno<small>SPSE · Control de usina</small></div>
    <div class="tb-right">
      <span id="syncPill" class="pill">…</span>
      <button id="btnSup" class="ghost small" type="button">Supervisor</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="sheet" class="sheet"></main>
  <footer class="actionbar">
    <div id="status" class="status"></div>
    <div class="actions">
      <button id="btnBack" class="btn" type="button" hidden>Hoja 1</button>
      <button id="btnMain" class="btn primary" type="button">Cerrar Turno</button>
    </div>
  </footer>
</div>
<div id="modal" class="modal" hidden><div id="modalCard" class="modal-card" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
/* ===================== Configuración base ===================== */
var TURNOS=['00:00 a 06:00','06:00 a 12:00','12:00 a 18:00','18:00 a 00:00'];
var CIST=[{n:'C1',m3:50,tel:1},{n:'C2',m3:50,tel:1},{n:'C3',m3:50,tel:1},{n:'C4',m3:30,tel:1},{n:'C5',m3:30,tel:1},{n:'C6',m3:25,tel:0},{n:'C7',m3:10,tel:0}];
var NTEL=5; // C1 a C5 con telemetría
var NCAM=7; // cisternas por camión de YPF
var DEF_CFG={distrito:'Perito Moreno',pin:'0000',syncUrl:'',syncKey:'',tolL:300,tolP:2,fotoRemito:true,fotoCaud:false,minAntes:15,horasTarde:2,
  operadores:{'1111':'Operador de prueba 1','2222':'Operador de prueba 2','3333':'Operador de prueba 3','4444':'Operador de prueba 4'}};
var DIAS_LOCAL=120; var DEMO_VER=3;
var SIM=null;try{var se=document.getElementById('simdata');if(se)SIM=JSON.parse(se.textContent);}catch(e){SIM=null;}
var simEsc=null; // días que se guardan en el dispositivo después de sincronizar

/* ===================== Almacenamiento ===================== */
var mem={};
function sget(k,d){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v);}catch(e){}return Object.prototype.hasOwnProperty.call(mem,k)?JSON.parse(JSON.stringify(mem[k])):d;}
function sset(k,v){mem[k]=JSON.parse(JSON.stringify(v));try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function sdel(k){delete mem[k];try{localStorage.removeItem(k);}catch(e){}}
var cfg=Object.assign({},DEF_CFG,sget('cpt.cfg',{}));
if(SIM){simEsc=sget('cpt.simEsc','errores');if(!SIM.escenarios[simEsc])simEsc='errores';DEMO_VER='sim1-'+simEsc;}
function saveCfg(){sset('cpt.cfg',cfg);}
var deviceId=sget('cpt.device',null);if(!deviceId){deviceId='DISP-'+Math.random().toString(36).slice(2,8).toUpperCase();sset('cpt.device',deviceId);}

/* ===================== Fotos (IndexedDB) ===================== */
var fotoMem={},dbP=null;
function db(){if(dbP)return dbP;dbP=new Promise(function(res){try{var rq=indexedDB.open('cpt-fotos',1);rq.onupgradeneeded=function(){rq.result.createObjectStore('f');};rq.onsuccess=function(){res(rq.result);};rq.onerror=function(){res(null);};}catch(e){res(null);}});return dbP;}
function idb(mode,fn){return db().then(function(d){if(!d)return null;return new Promise(function(res){try{var tx=d.transaction('f',mode),st=tx.objectStore('f'),rq=fn(st);tx.oncomplete=function(){res(rq&&rq.result);};tx.onerror=function(){res(null);};}catch(e){res(null);}});});}
function fotoPut(id,data){fotoMem[id]=data;return idb('readwrite',function(st){return st.put(data,id);});}
function fotoGet(id){if(fotoMem[id])return Promise.resolve(fotoMem[id]);return idb('readonly',function(st){return st.get(id);}).then(function(v){if(v)fotoMem[id]=v;return v||null;});}
function fotoDel(id){delete fotoMem[id];return idb('readwrite',function(st){return st.delete(id);});}
function achicar(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){var M=1280,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,M/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.62));};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('imagen ilegible'));};im.src=u;});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});}catch(e){}

/* ===================== Utilidades ===================== */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function r2(n){return Math.round(n*100)/100;}
function parseAR(s){
  if(s==null)return null; s=String(s).trim().replace(/\s/g,''); if(!s)return null;
  if(s.indexOf(',')>=0){s=s.replace(/\./g,'').replace(',','.');}
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'');}
  var n=Number(s); return isFinite(n)?r2(n):null;
}
var nf0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:2});
var nf2=new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
function fmt(v,two){if(v==null||isNaN(v))return '';return (two?nf2:nf0).format(v);}
function pad2(n){return (n<10?'0':'')+n;}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function addDays(iso,n){var p=iso.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function fFecha(iso){if(!iso)return '__/__/____';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function skey(o){return o.fecha+'#'+o.turno;}
function nextOf(f,t){return t<3?{fecha:f,turno:t+1}:{fecha:addDays(f,1),turno:0};}
function prevOf(f,t){return t>0?{fecha:f,turno:t-1}:{fecha:addDays(f,-1),turno:3};}
function sum(a){return r2(a.reduce(function(s,v){return s+(v||0);},0));}
function clone(o){return JSON.parse(JSON.stringify(o));}
function slotEnd(o){var p=o.fecha.split('-');return new Date(+p[0],+p[1]-1,+p[2],(o.turno+1)*6,0,0);}
function hhmm(d){return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function slotLabel(o){return fFecha(o.fecha)+' · '+TURNOS[o.turno];}
var toastT;

/* ===================== Turnos cerrados y cadena ===================== */
function getTurnos(){return sget('cpt.turnos',[]);}
function saveTurnos(a){a.sort(function(x,y){return skey(x)<skey(y)?-1:1;});sset('cpt.turnos',a);}
function getQueue(){return sget('cpt.queue',[]);}
function queueAdd(id){var q=getQueue();if(q.indexOf(id)<0)q.push(id);sset('cpt.queue',q);}
function currentSlot(){
  var c=[];var a=getTurnos();
  var q=getQueue();
  if(a.length){var l=a[a.length-1];c.push({fecha:l.fecha,turno:l.turno,total:l.total,pri:q.indexOf(l.id)>=0?2:0});}
  var r=sget('cpt.remoteLast',null);if(r&&r.distrito===cfg.distrito)c.push({fecha:r.fecha,turno:r.turno,total:r.total,pri:1});
  var b=sget('cpt.base',null);if(b){var p=prevOf(b.fecha,b.turno);c.push({fecha:p.fecha,turno:p.turno,total:b.inicio});}
  if(!c.length)return null;
  c.sort(function(x,y){var a1=skey(x),b1=skey(y);if(a1!==b1)return a1<b1?1:-1;return (y.pri||0)-(x.pri||0);});
  var n=nextOf(c[0].fecha,c[0].turno);return {fecha:n.fecha,turno:n.turno,inicio:c[0].total};
}

/* ===================== Borrador del turno ===================== */
function newTruck(){var c=[];for(var i=0;i<NCAM;i++)c.push(null);return {hora:'',remito:'',litros:null,op:'',entrega:'',fecha:'',cist:c,corregido:false};}
function newDraft(slot){return {slot:slot,obs:'',camiones:[],exist:[null,null,null,null,null,null,null],legajo:'',aclaracion:'',firma:null,fotoCaud:null};}
function hasContent(d){return d&&(d.obs||d.camiones.length||d.exist.some(function(v){return v!=null;})||d.firma);}
var D=null,page=1,editing=null;
function loadDraft(silent){
  var slot=currentSlot();if(!slot){D=null;return;}
  var d=sget('cpt.draft',null);
  if(d&&d.slot&&skey(d.slot)===skey(slot)){d.slot.inicio=slot.inicio;D=d;}

/* ===================== Reglas de negocio ===================== */
function calc(d){var ing=sum(d.camiones.map(function(c){return c.litros;}));var all=d.exist.every(function(v){return v!=null;});var tot=sum(d.exist);return {ingresos:ing,total:tot,consumo:r2(d.slot.inicio+ing-tot),allExist:all};}
function isRound(v){return v!=null&&v>0&&Math.abs(v%1000)<1e-9;}
function tStarted(c){return !!(c.hora||c.remito||c.litros!=null);}
function tSum(c){return sum(c.cist);}
function tJustified(c){var s=tSum(c);return c.corregido&&s>0&&c.litros!=null&&Math.abs(c.litros-s)<0.005;}
function tH2Ok(c){return !!String(c.op).trim()&&!!String(c.entrega).trim()&&tJustified(c);}
function remitoOk(r){return /^\d{4}-\d{8}$/.test(r||'');}
function horaEnTurno(h,t){if(!h)return true;var hh=+h.slice(0,2);return hh>=t*6&&hh<(t+1)*6;}
function fmtRemito(v){var d=String(v).replace(/\D/g,'');if(d.length>4)return d.slice(0,4)+'-'+d.slice(4,12);return d;}
function remitosUsados(){var m={};getTurnos().forEach(function(t){if(editing&&t.id===editing)return;(t.camiones||[]).forEach(function(c){m[c.remito]=t;});});return m;}
function remNum(r){return Number(String(r).replace(/\D/g,''));}
function maxRemito(){var mx=null;getTurnos().forEach(function(t){if(editing&&t.id===editing)return;(t.camiones||[]).forEach(function(c){if(remitoOk(c.remito)&&(!mx||remNum(c.remito)>remNum(mx)))mx=c.remito;});});return mx;}
function fechaRemitoAviso(t,fIng){if(!t.fecha)return '';if(t.fecha>fIng)return 'Fecha del remito posterior al ingreso';var dd=(new Date(fIng)-new Date(t.fecha))/864e5;if(dd>3)return 'Remito emitido hace '+Math.round(dd)+' días';return '';}
function legajoOk(l){return Object.prototype.hasOwnProperty.call(cfg.operadores,String(l).trim());}

function problems(d){
  var p=[];var c=calc(d);var used=remitosUsados();var seen={};
  d.camiones.forEach(function(t,i){
    var n='Camión '+(i+1)+': ';
    if(!t.hora)p.push({h:1,m:n+'falta el horario'});
    if(!remitoOk(t.remito))p.push({h:1,m:n+'el remito debe tener el formato 0000-00000000'});
    else{ if(seen[t.remito])p.push({h:1,m:n+'remito repetido en este turno'}); seen[t.remito]=1;
      if(used[t.remito])p.push({h:1,m:n+'el remito '+t.remito+' ya se cargó en el turno '+slotLabel(used[t.remito])}); }
    if(!(t.litros>0))p.push({h:1,m:n+'faltan los litros'});
  });
  d.exist.forEach(function(v,i){
    if(v==null)p.push({h:1,m:'Falta la existencia de '+CIST[i].n});
    else if(v<0)p.push({h:1,m:CIST[i].n+': la existencia no puede ser negativa'});
    else if(v>CIST[i].m3*1000)p.push({h:1,m:CIST[i].n+' supera su capacidad ('+fmt(CIST[i].m3*1000)+' L)'});
  });
  d.camiones.forEach(function(t,i){
    if(!tStarted(t))return; var n='Hoja 2 · Camión '+(i+1)+': ';
    if(!String(t.op).trim())p.push({h:2,m:n+'falta OP = Pedido'});
    if(!String(t.entrega).trim())p.push({h:2,m:n+'falta Entrega/Reserva'});
    if(!(tSum(t)>0))p.push({h:2,m:n+'faltan los litros de las cisternas'});
    else if(!tJustified(t))p.push({h:2,m:n+'tocá «Corregir Litros»'});
    if(cfg.fotoRemito&&!t.foto&&!editing)p.push({h:2,m:n+'falta la foto del remito'});
  });
  if(cfg.fotoCaud&&!d.fotoCaud&&!editing)p.push({h:1,m:'Falta la foto de los caudalímetros'});
  if(c.allExist&&c.consumo<0&&!d.obs.trim())p.push({h:1,m:'El consumo da negativo: explicá la causa en Observación'});
  if(!editing){
    if(!legajoOk(d.legajo))p.push({h:0,m:d.legajo?'El legajo '+d.legajo+' no está habilitado':'Falta el número de legajo'});
    if(!d.aclaracion.trim())p.push({h:0,m:'Falta la aclaración (nombre y apellido)'});
    if(!d.firma)p.push({h:0,m:'Falta la firma'});
    var fin=slotEnd(d.slot),desde=new Date(fin.getTime()-(cfg.minAntes||0)*60000);
    if(new Date()<desde)p.unshift({h:0,m:'El turno termina a las '+hhmm(fin)+'. Se puede cerrar desde las '+hhmm(desde)+'.'});
  }
  return p;
}

var fotoInput=document.createElement('input');fotoInput.type='file';fotoInput.accept='image/*';fotoInput.setAttribute('capture','environment');fotoInput.hidden=true;document.body.appendChild(fotoInput);

function refresh(){

  bm.hidden=false;
  var c=calc(D);

    var vC=$('#vCons');if(vC){vC.textContent=c.allExist?fmt(c.consumo):'—';$('#kvCons').classList.toggle('neg',c.allExist&&c.consumo<0);}
    var vT=$('#vTot');if(vT)vT.textContent=fmt(c.total)||'0';
    CIST.forEach(function(ci,i){var g=$('#cg'+i),inp=$('#ce'+i);if(!g)return;var v=D.exist[i]||0,cap=ci.m3*1000;g.style.width=Math.min(100,v/cap*100)+'%';g.classList.toggle('over',v>cap);inp.classList.toggle('bad',v>cap||v<0);});
    var used=remitosUsados();
    D.camiones.forEach(function(t,i){
      var lit=$('#tl'+i),fl=$('#tf'+i),rem=$('#tr'+i);if(!lit)return;
      lit.classList.toggle('round',isRound(t.litros)&&!tJustified(t));
      rem.classList.toggle('bad',!!t.remito&&(!remitoOk(t.remito)||!!used[t.remito]));
      var chips=[];
      if(isRound(t.litros)&&!tJustified(t))chips.push('<span class="chip r">Litros redondos: justificar en Hoja 2</span>');
      else if(tStarted(t)&&!tH2Ok(t))chips.push('<span class="chip y">Falta completar Hoja 2</span>');
      else if(tH2Ok(t))chips.push('<span class="chip g">Litros justificados</span>');
      if(t.hora&&!horaEnTurno(t.hora,D.slot.turno))chips.push('<span class="chip y">Horario fuera del turno</span>');
      if(t.remito&&used[t.remito])chips.push('<span class="chip r">Remito ya cargado</span>');
      else if(remitoOk(t.remito)){var mx=maxRemito();if(mx&&remNum(t.remito)<remNum(mx))chips.push('<span class="chip y">Número anterior al último remito cargado ('+esc(mx)+')</span>');}
      var fw=fechaRemitoAviso(t,D.slot.fecha);if(fw)chips.push('<span class="chip y">'+esc(fw)+'</span>');
      fl.innerHTML=chips.join('');
    });
  }else{
    D.camiones.forEach(function(t,i){
      var tt=$('#h2t'+i);if(!tt)return;var s=tSum(t);
      tt.textContent=fmt(s,true)||'0,00';
      var d=$('#h2d'+i);d.textContent=fmt(t.litros,true)||'—';d.classList.toggle('round',isRound(t.litros)&&!tJustified(t));
      var ch=$('#h2c'+i),ok=tH2Ok(t);

function setupPad(){
  var cv=$('#pad');if(!cv)return;var ctx=cv.getContext('2d');var drawn=false;
  function size(){
    var r=cv.getBoundingClientRect();var dpr=window.devicePixelRatio||1;
    cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--pad-ink').trim()||'#101820';
    if(D.firma){var img=new Image();img.onload=function(){ctx.drawImage(img,0,0,r.width,r.height);};img.src=D.firma;}
  }
  size();cv._resize=size;
  var last=null;
  function pt(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();cv.setPointerCapture(e.pointerId);last=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y+.1);ctx.stroke();drawn=true;});
  cv.addEventListener('pointermove',function(e){if(!last)return;var p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  function end(){if(!last)return;last=null;if(drawn){var o=document.createElement('canvas');o.width=420;o.height=Math.round(420*cv.height/cv.width);var oc=o.getContext('2d');oc.fillStyle='#ffffff';oc.fillRect(0,0,o.width,o.height);oc.drawImage(cv,0,0,o.width,o.height);D.firma=o.toDataURL('image/png');persist();refresh();}}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  $('#padClear').addEventListener('click',function(){D.firma=null;ctx.clearRect(0,0,cv.width,cv.height);drawn=false;persist();refresh();});
}

function diff(o,n){

function cascade(a){
  for(var i=1;i<a.length;i++){
    var pr=a[i-1],cu=a[i],ex=nextOf(pr.fecha,pr.turno);

    if(cu.inicio!==pr.total){var old=cu.inicio;cu.inicio=pr.total;cu.consumo=r2(cu.inicio+cu.ingresos-cu.total);
      cu.ediciones=(cu.ediciones||[]).concat([{cuando:new Date().toISOString(),por:'Sistema',cambios:['Inicio recalculado '+fmt(old,true)+' → '+fmt(cu.inicio,true)+' por edición del turno anterior']}]);
      if(!cu.demo){cu.sync='pendiente';queueAdd(cu.id);}}
  }
}

  if(!n.demo){n.sync='pendiente';queueAdd(n.id);}
  a[idx]=n;cascade(a);saveTurnos(a);

}

/* ===================== Sincronización con Google Sheets ===================== */
var syncing=false,lastErr=null;
function updatePill(){
  var p=$('#syncPill'),q=getQueue().length;
  var cls='pill',txt;
  if(syncing){txt='Sincronizando…';}
  else if(!navigator.onLine){cls+=' warn';txt='Sin conexión'+(q?' · '+q+' pendiente'+(q>1?'s':''):'');}
  else if(!cfg.syncUrl){txt=q?q+' sin enviar':'Sin sincronizar';}
  else if(lastErr){cls+=' err';txt='Error de envío'+(q?' · '+q:'');}
  else if(q){cls+=' warn';txt=q+' pendiente'+(q>1?'s':'');}
  else{cls+=' ok';txt='Al día';}
  p.className=cls;p.textContent=txt;
}
function fotosDe(r){var o=[];if(r.fotoCaud)o.push({f:r.fotoCaud,n:r.id+'_caudalimetros'});(r.camiones||[]).forEach(function(c){if(c.foto)o.push({f:c.foto,n:r.id+'_remito_'+c.remito});});return o;}
function subirFotos(rec){
  var ch=Promise.resolve();
  fotosDe(rec).forEach(function(x){if(x.f.url)return;ch=ch.then(function(){return fotoGet(x.f.id).then(function(data){
    if(!data)return;
    return postJSON({key:cfg.syncKey,accion:'guardarFoto',id:x.f.id,nombre:x.n,data:data}).then(function(res){
      if(!res||!res.ok)throw new Error(res&&res.error||'no se pudo subir la foto');
      x.f.url=res.url;var b=getTurnos();b.forEach(function(r){if(r.id===rec.id){fotosDe(r).forEach(function(y){if(y.f.id===x.f.id)y.f.url=res.url;});}});saveTurnos(b);fotoDel(x.f.id);
    });});});});
  return ch;
}
function postJSON(body){return fetch(cfg.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json();});}
function sync(manual){
  if(syncing)return Promise.resolve();
  if(!cfg.syncUrl){if(manual)toast('Cargá la dirección de sincronización en Configuración.');updatePill();return Promise.resolve();}
  if(!navigator.onLine){if(manual)toast('Sin conexión. Los turnos quedan guardados y se envían solos al volver internet.');updatePill();return Promise.resolve();}
  syncing=true;updatePill();
  var a=getTurnos(),q=getQueue();
  var chain=Promise.resolve();
  q.forEach(function(id){chain=chain.then(function(){
    var rec=a.filter(function(r){return r.id===id;})[0];
    if(!rec||rec.demo){sset('cpt.queue',getQueue().filter(function(x){return x!==id;}));return;}
    return subirFotos(rec).then(function(){return postJSON({key:cfg.syncKey,accion:'guardarTurno',turno:rec});}).then(function(res){
      if(!res||!res.ok)throw new Error(res&&res.error||'respuesta inválida');
      sset('cpt.queue',getQueue().filter(function(x){return x!==id;}));
      var b=getTurnos();b.forEach(function(r){if(r.id===id)r.sync='ok';});saveTurnos(b);
    });
  });});
  return chain.then(function(){
    var u=cfg.syncUrl+(cfg.syncUrl.indexOf('?')>=0?'&':'?')+'accion=estado&distrito='+encodeURIComponent(cfg.distrito)+'&key='+encodeURIComponent(cfg.syncKey);
    return fetch(u).then(function(r){return r.json();});
  }).then(function(st){
    if(!st||!st.ok)throw new Error(st&&st.error||'respuesta inválida');
    if(st.ultimo)sset('cpt.remoteLast',{fecha:st.ultimo.fecha,turno:+st.ultimo.turno,total:+st.ultimo.total,distrito:cfg.distrito});
    if(st.operadores&&Object.keys(st.operadores).length){cfg.operadores=st.operadores;saveCfg();}
    prune();lastErr=null;if(manual)toast('Sincronización completa.');
  }).catch(function(e){lastErr=e.message;if(manual)toast('No se pudo sincronizar: '+e.message);})
  .then(function(){syncing=false;updatePill();
    if(!editing&&!D){loadDraft(true);if(D)render();}
    else if(!editing&&D){var s=currentSlot();if(s&&skey(s)!==skey(D.slot)){loadDraft(false);render();}else if(s&&s.inicio!==D.slot.inicio){D.slot.inicio=s.inicio;persist();render();}}
  });
}
function prune(){
  var lim=addDays(todayISO(),-DIAS_LOCAL),a=getTurnos(),q=getQueue();
  var keep=a.filter(function(t,i){return i===a.length-1||q.indexOf(t.id)>=0||t.fecha>=lim;});
  if(keep.length!==a.length)saveTurnos(keep);
}
window.addEventListener('online',function(){sync(false);});
window.addEventListener('offline',updatePill);
